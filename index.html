<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To‑Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app" aria-live="polite">
      <header class="header">
        <div class="brand">
          <div class="logo" aria-hidden="true">✓</div>
          <div>
            <h1>To‑Do List</h1>
            <p>Organize your day with style</p>
          </div>
        </div>
        <div class="actions">
          <button
            class="theme-toggle"
            id="themeToggle"
            aria-pressed="false"
            title="Toggle theme"
          >
            <span id="themeIcon" aria-hidden="true">🌙</span>
          </button>
        </div>
      </header>

      <!-- Composer -->
      <section class="composer" aria-label="Add a task">
        <div class="fields">
          <input
            id="taskInput"
            class="task-input"
            type="text"
            placeholder="Add a new task…"
            autocomplete="off"
          />
          <input id="dateInput" class="date-input" type="date" />
        </div>
        <div class="actions">
          <button id="addBtn" class="btn btn-primary">Add Task</button>
        </div>
      </section>

      <!-- Toolbar -->
      <section class="toolbar" aria-label="Controls">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="chip" data-filter="all" aria-pressed="true">
            All
          </button>
          <button class="chip" data-filter="active" aria-pressed="false">
            Active
          </button>
          <button class="chip" data-filter="completed" aria-pressed="false">
            Completed
          </button>
        </div>
        <div class="search" role="search">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M21 21l-3.5-3.5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <circle
              cx="11"
              cy="11"
              r="7"
              stroke="currentColor"
              stroke-width="2"
              fill="none"
            />
          </svg>
          <input
            id="searchInput"
            type="search"
            placeholder="Search tasks"
            aria-label="Search tasks"
          />
        </div>
      </section>

      <!-- List -->
      <section class="list" id="list" aria-label="Task list">
        <p class="empty" id="empty">No tasks yet — add one above 👆</p>
      </section>

      <footer class="footer">
        <div>
          <strong id="count">0</strong> items •
          <span id="activeCount">0 active</span>
        </div>
        <div class="row-actions">
          <button id="clearCompleted" class="btn btn-outline">
            Clear Completed
          </button>
          <button
            id="exportBtn"
            class="btn btn-outline"
            title="Export tasks as JSON"
          >
            Export
          </button>
          <label
            class="btn btn-outline"
            for="importFile"
            title="Import tasks from JSON"
            >Import<input
              id="importFile"
              type="file"
              accept="application/json"
              hidden
          /></label>
        </div>
      </footer>
    </main>

    <template id="taskTemplate">
      <article class="task" draggable="true" data-id="">
        <div class="drag-handle" title="Drag to reorder" aria-hidden="true">
          ⋮⋮
        </div>
        <input type="checkbox" class="check" aria-label="Mark task complete" />
        <div class="content">
          <div class="title"></div>
          <input
            class="edit-input task-input"
            type="text"
            aria-label="Edit task"
          />
          <div class="meta">
            <span class="due tag" hidden></span>
            <span class="created"></span>
          </div>
        </div>
        <div class="row-actions">
          <button class="icon-btn edit" title="Edit">✏️</button>
          <button class="icon-btn danger delete" title="Delete">🗑️</button>
        </div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
